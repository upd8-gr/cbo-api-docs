        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductErrorResponse'
              examples:
                notFound:
                  value:
                    status: not_found
                    message: Product not found.
                    errors: []
    put:
      tags:
        - Products
      summary: Product (update full)
      description: |
        Updates a parent product for the company. Validation failures return **422** with
        `status: validation_error`. If the model fails to persist, **422** with
        `status: business_validation_error`. An unexpected runtime exception rolls back and returns **500**
        with `status: server_error`.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductUpdate'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductSingleResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductErrorResponse'
              examples:
                notFound:
                  value:
                    status: not_found
                    message: Product not found.
                    errors: []
        '422':
          description: Validation error or business validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductErrorResponse'
              examples:
                validation:
                  value:
                    status: validation_error
                    message: Validation failed.
                    errors:
                      group_id:
                        - The selected group_id must be a category.
                business:
                  value:
                    status: business_validation_error
                    message: Product could not be updated.
                    errors: []
        '500':
          description: Unexpected error while updating the product
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductErrorResponse'
              examples:
                server:
                  value:
                    status: server_error
                    message: Failed to update product.
                    errors: []
    patch:
      tags:
        - Products
      summary: Product (update partial)
      description: |
        Partially updates a parent product for the company. Behaves identically to `PUT` — send only the
        fields to change. Validation failures return **422** (`status: validation_error`), a failed persist
        returns **422** (`status: business_validation_error`), and an unexpected exception returns **500**
        (`status: server_error`).
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductUpdate'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductSingleResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductErrorResponse'
        '422':
          description: Validation error or business validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductErrorResponse'
        '500':
          description: Unexpected error while updating the product
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductErrorResponse'
    delete:
      tags:
        - Products
      summary: Product (delete)
      description: |
        Deletes a parent product. If the product has any variants (child products), deletion is refused with
        **409** (`status: conflict`). If the delete otherwise fails, **422** with
        `status: business_validation_error`. On success returns `{ success: true, message }`.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessageResponse'
              examples:
                deleted:
                  value:
                    success: true
                    message: Product deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductErrorResponse'
              examples:
                notFound:
                  value:
                    status: not_found
                    message: Product not found.
                    errors: []
        '409':
          description: Conflict — product has variants and cannot be deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductErrorResponse'
              examples:
                conflict:
                  value:
                    status: conflict
                    message: Product cannot be deleted because it has variants.
                    errors: []
        '422':
          description: Business validation error — delete failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductErrorResponse'
              examples:
                business:
                  value:
                    status: business_validation_error
                    message: Product could not be deleted.
                    errors: []
