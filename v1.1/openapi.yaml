    post:
      tags:
        - Client Receipts
      summary: Client receipt (create)
      description: |
        Records a standalone payment receipt (`cash-receipt`) or money refund (`return`),
        optionally settling existing documents through `allocations`.

        The document has no lines: `amount` is the whole of it, and it takes its serial number
        from the receipt sequence rather than from an invoice type. Leaving `allocations` out
        records the payment on account, which is a valid state and the way to record an
        advance larger than any single balance.

        A card payment carrying a `terminal_id` is filed with myDATA as 8.4 (receipt) or 8.5 (refund) and comes back `Pending`; the transmission runs after the document is committed.

