          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
        - Invoice Types
      summary: Invoice type (delete)
      description: |
        Deletes an invoice type (document type). Cannot delete the default type for its category.
        Returns 404 if the type does not exist or belongs to another company (same message as not found).
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessageResponse'
              examples:
                deleted:
                  value:
                    success: true
                    message: Invoice type deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Not found (unknown id or not in company scope)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FailureMessageResponse'
              examples:
                notFound:
                  value:
                    success: false
                    message: Invoice type not found.
        '422':
          description: |
            Business validation error — either the type is the default document type for its category, or it cannot be deleted because it has related invoices, supplier invoices, or branch links.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FailureMessageResponse'
              examples:
                defaultType:
                  value:
                    success: false
                    message: Cannot delete the default document type for this category.
                hasRelations:
                  value:
                    success: false
                    message: Invoice type cannot be deleted because it has related invoices, supplier invoices, or branch links.
