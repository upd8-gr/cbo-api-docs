            properties:
              product_id:
                type: integer
                nullable: true
                description: products_children.id
              expense_id:
                type: integer
                nullable: true
                description: |
                  expenses.id — the expense category of the line. Defaults to the supplier's expense category, then to the product's.
              description:
                type: string
                nullable: true
                maxLength: 255
                description: |
                  Optional when `product_id` is given; it then defaults to the product name.
              quantity:
                type: number
                minimum: 0.001
                description: Required when items is present.
              measure_unit:
                type: string
                nullable: true
                maxLength: 255
                description: |
                  The unit written as free text. Matched against the company's measurement units by name, short name, plural, common abbreviation, english wording and peppol code, ignoring case, accents and trailing dots — so "Τεμάχια", "τεμ.", "pcs" and "C62" all reach the same unit. A bare number is read as the myDATA unit code. When nothing matches close enough the line falls back to the product's unit and then to the company's default unit ("Τεμάχιο"): an unrecognised spelling is never an error.
                example: τεμ.
              measurement_unit_id:
                type: integer
                nullable: true
                description: |
                  measurement_units.id — takes precedence over `measure_unit`. Ignored (and resolved as if absent) when the id belongs to another company.
              unit_price:
                type: number
                nullable: true
                minimum: 0
                description: |
                  Defaults to the supplier's cost for the product (or the product cost price) when `product_id` is given.
              discount_percentage:
                type: number
                nullable: true
                minimum: 0
                maximum: 100
              taricNo:
                type: string
                nullable: true
                maxLength: 10
                description: |
                  TARIC/CN code of the line. Stored on the matched product when it has none yet.
              taxes:
                type: array
                nullable: true
                description: |
                  Tax ids applied to the line (VAT included). Defaults to the product's tax for the supplier's tax type when `product_id` is given.
                items:
                  type: integer
                  description: taxes.id
              mydata_classification_category:
                type: string
                nullable: true
                maxLength: 255
                description: myDATA classification category. Required when mydata_submit is set.
              mydata_classification_type:
                type: string
                nullable: true
                maxLength: 255
                description: myDATA classification type. Required when mydata_submit is set.
              vat_exemption_category:
                type: integer
                nullable: true
        taxes:
          type: array
          nullable: true
          items:
            type: integer
            description: taxes.id
        payment_methods:
          type: array
          nullable: true
          description: Required when `payment_way` is `cash`; otherwise prohibited.
          items:
            type: object
            additionalProperties: false
            properties:
              paymentMethod:
                type: integer
                enum:
                  - 1
                  - 2
                  - 3
                  - 4
                  - 6
                  - 7
                  - 8
                description: |
                  Values:
                  - 1: Domestic Payments Account
                  - 2: Foreign Payments Account
                  - 3: Cash
                  - 4: Cheque
                  - 6: Web Banking
                  - 7: POS / e-POS
                  - 8: IRIS Direct Payment
              paymentAmount:
                type: number
                minimum: 0
              terminal_id:
                type: integer
                nullable: true
                description: terminal_id from CBO (terminals table). Typically for paymentMethod 7 (POS / e-POS).
              instalments:
                type: integer
                nullable: true
                minimum: 0
              tip:
                type: number
                nullable: true
                minimum: 0
              paymentMethodInfo:
                type: string
                nullable: true
                maxLength: 255
        terms:
          type: string
          nullable: true
          maxLength: 1000
        notes:
          type: string
          nullable: true
          maxLength: 1000
        payment_way:
          type: string
          nullable: true
          enum:
            - cash
            - on-credit
        currency_code:
          type: string
          nullable: true
          maxLength: 3
        branch_id:
          type: integer
          nullable: true
