components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Send `Authorization: Bearer {token}`'
    XAssebloCompany:
      type: apiKey
      in: header
      name: X-Asseblo-Company
      description: 'Company ID. Example value: 1234567890'
  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
      example: 1
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
      example: 1
  responses:
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            message: Unauthenticated.
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            message: Forbidden.
    NotFound:
      description: Not Found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            message: Not Found.
    UnprocessableEntity:
      description: Validation error (Laravel)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'
    TooManyRequests:
      description: Too Many Requests - Rate limit exceeded (1000 calls/day or 60 requests/minute)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            message: Too many requests. Rate limit exceeded.
  schemas:
    Address:
      type: object
      additionalProperties: true
      description: Address output (AddressResource). Null fields are omitted from the response.
      properties:
        address:
          type: string
          example: Main street
        number:
          type: string
          nullable: true
          example: '10'
        zip:
          type: string
          description: Postal code (maps from tk).
          example: '10558'
        city:
          type: string
          description: Town/city (maps from town).
          example: Athens
        region:
          type: string
          nullable: true
          example: Attica
        country:
          type: string
          description: ISO country code; '--' when unset.
          example: GR
        branch_code:
          type: integer
          nullable: true
          example: 0
        address_type:
          type: string
          enum:
            - billing
            - shipping
            - else
          description: Derived from status (1=billing, 2=shipping, otherwise else).
          example: billing
        default:
          type: boolean
          example: true
    ContactDetail:
      type: object
      additionalProperties: true
      description: Contact output (ContactResource). Null fields are omitted from the response.
      properties:
        id:
          type: integer
          format: int64
          example: 1
        first_name:
          type: string
          nullable: true
          example: Maria
        last_name:
          type: string
          nullable: true
          example: Nikolaou
        email:
          type: string
          nullable: true
          example: m@example.com
        telephone:
          type: string
          nullable: true
          description: Maps from phone.
          example: '2100000000'
        mobile:
          type: string
          nullable: true
          example: '6900000000'
        position:
          type: string
          nullable: true
          example: Manager
        isDefault:
          type: boolean
          example: true
    Tag:
      type: object
      additionalProperties: true
      description: Tag output (TagResource).
      properties:
        id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: vip
    Client:
      type: object
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
          example: 1
        code:
          type: string
          nullable: true
          description: Client code (primary_id).
          example: C-0001
        first_name:
          type: string
          nullable: true
          example: Giorgos
        last_name:
          type: string
          nullable: true
          example: Papadopoulos
        email:
          type: string
          nullable: true
          example: g@example.com
        phone:
          type: string
          nullable: true
          example: '2100000000'
        mobile:
          type: string
          nullable: true
          example: null
        vat:
          type: string
          nullable: true
          example: '123456789'
        invoice_name:
          type: string
          nullable: true
          example: ACME SA
        company_name:
          type: string
          nullable: true
          example: ACME SA
        tax_office:
          type: string
          nullable: true
          description: Tax office name (computed).
          example: Α Αθηνών
        profession:
          type: string
          nullable: true
          example: Engineer
        client_type:
          type: integer
          description: Client type. Type 1 is company (B2B), type 2 is person (B2C).
          nullable: true
          enum:
            - 1
            - 2
          example: 1
        tax_type:
          type: integer
          nullable: true
          enum:
            - 1
            - 2
            - 3
          example: 1
        payment_way:
          type: string
          nullable: true
          enum:
            - cash
            - on-credit
          example: cash
        comments:
          type: string
          nullable: true
          example: null
        addresses:
          type: array
          items:
            $ref: '#/components/schemas/Address'
        contacts:
          type: array
          items:
            $ref: '#/components/schemas/ContactDetail'
        tags:
          type: array
          items:
            $ref: '#/components/schemas/Tag'
        company:
          type: integer
          format: int64
          example: 1
        created:
          type: string
          example: '2026-02-11 10:00:00'
        modified:
          type: string
          example: '2026-02-12 10:00:00'
      required:
        - id
        - company
        - created
        - modified
    Order:
      type: object
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
          example: 1
        serial_number:
          type: string
          description: Human-readable order number prefixed with
          example: '#1001'
        title:
          type: string
          nullable: true
          maxLength: 255
          example: Order for ACME SA
        purchase_order:
          type: string
          nullable: true
          maxLength: 20
          example: PO-2026-001
        is_offer:
          type: boolean
          description: Whether this order is treated as an offer/quote.
          example: false
        is_external:
          type: boolean
          description: Whether this order originated from an external source (e.g. e-shop).
          example: false
        client_id:
          type: integer
          format: int64
          nullable: true
          description: ID of the billing client.
          example: 5
        client:
          nullable: true
          description: Client object (included when loaded).
          oneOf:
            - $ref: '#/components/schemas/Client'
          example: null
        items:
          type: array
          description: Order line items (included when loaded).
          items:
            type: object
            additionalProperties: true
        comments:
          type: string
          nullable: true
          maxLength: 5000
          example: null
        project_id:
          type: integer
          format: int64
          nullable: true
          example: null
        company:
          type: integer
          format: int64
          example: 1
        created:
          type: string
          description: Creation datetime (raw DB value).
          example: '2026-04-27 09:00:00'
        modified:
          type: string
          description: Last modification datetime (raw DB value).
          example: '2026-04-27 10:00:00'
      required:
        - id
        - serial_number
        - is_offer
        - is_external
        - items
        - created
        - modified
    OrderIndexResponse:
      type: object
      additionalProperties: false
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/Order'
        meta:
          type: object
          additionalProperties: false
          properties:
            current_page:
              type: integer
              example: 1
            last_page:
              type: integer
              example: 3
            per_page:
              type: integer
              example: 50
            total:
              type: integer
              example: 120
          required:
            - current_page
            - last_page
            - per_page
            - total
      required:
        - success
        - data
        - meta
    ErrorResponse:
      type: object
      description: |
        Generic error envelope. API-generated errors (403/404 from controllers and form requests) include `status` and an empty `errors` array; framework-level responses (401 authentication, 429 rate limit) return only `message`.
      properties:
        status:
          type: string
          description: Machine-readable error code (e.g. `forbidden`, `not_found`). Absent on framework auth/rate-limit responses.
          example: not_found
        message:
          type: string
          example: Resource not found.
        errors:
          type: array
          description: Present (usually empty) on API-generated errors; absent on framework responses.
          items: {}
          example: []
      required:
        - message
    ValidationError:
      type: object
      additionalProperties: false
      properties:
        status:
          type: string
          description: Machine-readable error code. Always `validation_error` for this response.
          example: validation_error
        message:
          type: string
          example: Validation failed.
        errors:
          type: object
          description: Map of field name to an array of validation messages.
          additionalProperties:
            type: array
            items:
              type: string
          example:
            name:
              - The name field is required.
      required:
        - status
        - message
        - errors
    OrderClientInput:
      type: object
      additionalProperties: false
      description: |
        Inline client block used when creating an order without an existing client_id. Either `afm` (for company/B2B clients) or `email` (for person/B2C clients) is required. If `afm` is provided, `invoice_name` is also required.
      properties:
        client_type:
          type: integer
          enum:
            - 1
            - 2
          description: Client type. 1 = company (B2B), 2 = person (B2C). Defaults to 1 when afm is set, 2 otherwise.
          example: 1
        invoice_name:
          type: string
          nullable: true
          maxLength: 255
          description: Required when `afm` is provided.
          example: ACME SA
        afm:
          type: string
          nullable: true
          maxLength: 20
          description: Greek VAT number. Can also be submitted as `vat` (alias). Leading 2-letter country prefix is stripped automatically.
          example: '123456789'
        company_name:
          type: string
          nullable: true
          maxLength: 255
          example: ACME SA
        first_name:
          type: string
          nullable: true
          maxLength: 255
          example: Giorgos
        last_name:
          type: string
          nullable: true
          maxLength: 255
          example: Papadopoulos
        email:
          type: string
          nullable: true
          format: email
          example: g@example.com
        phone:
          type: string
          nullable: true
          maxLength: 50
          example: '2100000000'
        mobile:
          type: string
          nullable: true
          maxLength: 50
          example: '6900000000'
        profession:
          type: string
          nullable: true
          maxLength: 255
          example: Engineer
        tax_office:
          type: string
          nullable: true
          maxLength: 255
          description: Tax office name (free text).
          example: Α Αθηνών
        tax_offices_id:
          type: integer
          nullable: true
          description: Tax office ID (from /tax-offices).
          example: 3
    OrderAddressInput:
      type: object
      additionalProperties: false
      description: |
        Address block for billing or shipping.
      properties:
        address:
          type: string
          maxLength: 255
          example: Σταδίου
        number:
          type: string
          nullable: true
          maxLength: 50
          example: '10'
        town:
          type: string
          maxLength: 150
          example: Αθήνα
        region:
          type: string
          nullable: true
          maxLength: 150
          example: Αττική
        zip:
          type: string
          maxLength: 20
          description: Postal code.
          example: '10562'
        country:
          type: string
          nullable: true
          maxLength: 3
          description: ISO 3166-1 alpha-2 or alpha-3 country code.
          example: GR
        branch_code:
          type: integer
          nullable: true
          description: Greek tax branch (ΔΟΥ) branch code.
          example: 0
      required:
        - address
        - town
        - zip
    OrderItemInput:
      type: object
      additionalProperties: false
      description: |
        A line item on an order. - Either `product_id` or `description` must be provided. - Either `retail_price` or `net_price` must be provided, but not both.
          If `total_tax` is also provided the price is treated as already net; otherwise
          `retail_price` is converted from gross to net using the resolved tax rate.
      properties:
        product_id:
          type: integer
          nullable: true
          description: Product child ID (from /product-children). Required when `description` is omitted.
          example: 42
        description:
          type: string
          nullable: true
          maxLength: 255
          description: Item description. Required when `product_id` is omitted.
          example: Custom Widget
        measure_unit:
          type: string
          nullable: true
          maxLength: 255
          description: Measurement unit name (e.g. "Τεμάχιο"). Looked up against /measurement-units.
          example: Τεμάχιο
        measurement_unit_id:
          type: integer
          nullable: true
          description: Measurement unit ID (from /measurement-units). Takes precedence over `measure_unit`.
          example: 1
        retail_price:
          type: number
          format: float
          nullable: true
          minimum: 0
          description: |
            Gross (incl. tax) unit price. Mutually exclusive with `net_price`. Converted to net automatically unless `total_tax` is provided.
          example: 24.8
        net_price:
          type: number
          format: float
          nullable: true
          minimum: 0
          description: Net (excl. tax) unit price. Mutually exclusive with `retail_price`.
          example: 20
        quantity:
          type: number
          format: float
          minimum: 0.001
          description: Item quantity.
          example: 2
        discount_percentage:
          type: number
          format: float
          nullable: true
          minimum: 0
          maximum: 100
          description: First discount percentage applied to the unit price.
          example: 10
        discount_percentage2:
          type: number
          format: float
          nullable: true
          minimum: 0
          maximum: 100
          description: Second (cascading) discount percentage.
          example: 0
        comments:
          type: string
          nullable: true
          maxLength: 1000
          example: null
        total_tax:
          type: number
          format: float
          nullable: true
          description: Total tax amount for this item. When supplied, the price is treated as already net.
          example: 4.8
        taxes:
          type: array
          nullable: true
          description: Array of tax IDs to apply (from /taxes).
          items:
            type: integer
          example:
            - 1
            - 3
      required:
        - quantity
    OrderAncillaryItemInput:
      type: object
      additionalProperties: false
      description: |
        Ancillary item (fee or shipping charge). Normalised internally to a standard job item with quantity 1 and measure unit "Υπηρεσία".
      properties:
        title:
          type: string
          maxLength: 255
          description: Item title/description.
          example: Shipping fee
        price:
          type: number
          format: float
          minimum: 0
          description: Unit price (gross).
          example: 5
        discount_percentage:
          type: number
          format: float
          nullable: true
          minimum: 0
          maximum: 100
          example: 0
        comments:
          type: string
          nullable: true
          maxLength: 1000
          example: null
        total_tax:
          type: number
          format: float
          nullable: true
          description: Total tax amount for this item.
          example: 1.2
      required:
        - title
        - price
    OrderStore:
      type: object
      additionalProperties: false
      description: |
        Request body for creating an order (POST /orders).
        **Client resolution precedence:** 1. `client_id` supplied → attach existing client by ID. 2. `client.afm` supplied → find by VAT within company, or create a new company (B2B) client. 3. `client.email` supplied → find by e-mail within company, or create a new person (B2C) client.
        Exactly one of `client_id` or a `client` block must be provided.
      properties:
        client_id:
          type: integer
          nullable: true
          description: ID of an existing client. Mutually exclusive with the `client` block.
          example: 7
        client:
          nullable: true
          description: Inline client data. Used to find or create a client when `client_id` is not supplied.
          allOf:
            - $ref: '#/components/schemas/OrderClientInput'
        billing_address:
          description: Billing address for the order.
          allOf:
            - $ref: '#/components/schemas/OrderAddressInput'
        shipping_address:
          description: |
            Shipping address for the order. Required when `dispatch_detail` is provided.
          allOf:
            - $ref: '#/components/schemas/OrderAddressInput'
        title:
          type: string
          nullable: true
          maxLength: 255
          example: Website redesign order
        purchase_order:
          type: string
          nullable: true
          maxLength: 20
          example: PO-2026-001
        comments:
          type: string
          nullable: true
          maxLength: 5000
          example: null
        isOffer:
          type: boolean
          nullable: true
          description: Mark this order as an offer/quote.
          example: false
        isExternal:
          type: boolean
          nullable: true
          description: Mark this order as externally originated (e.g. e-shop).
          example: false
        project_id:
          type: integer
          nullable: true
          description: Attach order to an existing project.
          example: null
        address_id:
          type: integer
          nullable: true
          description: Existing account address ID to associate with the order.
          example: null
        items:
          type: array
          nullable: true
          description: |
            Standard order line items. Each item requires either `product_id` or `description`, and exactly one of `retail_price` or `net_price`.
          items:
            $ref: '#/components/schemas/OrderItemInput'
        fee_items:
          type: array
          nullable: true
          description: |
            Fee items (e.g. handling charges). Normalised internally to job items with quantity 1 and measure unit "Υπηρεσία".
          items:
            $ref: '#/components/schemas/OrderAncillaryItemInput'
        shipping_items:
          type: array
          nullable: true
          description: |
            Shipping charge items. Normalised internally to job items with quantity 1 and measure unit "Υπηρεσία".
          items:
            $ref: '#/components/schemas/OrderAncillaryItemInput'
      required:
        - billing_address
    OrderSingleResponse:
      type: object
      additionalProperties: false
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/Order'
      required:
        - success
        - data
    OrderUpdate:
      type: object
      additionalProperties: false
      description: |
        Request body for partially updating an order (PUT/PATCH /orders/{id}). All fields are optional; only supplied fields are updated.
      properties:
        title:
          type: string
          nullable: true
          maxLength: 255
          example: Updated order title
        purchase_order:
          type: string
          nullable: true
          maxLength: 20
          example: PO-2026-002
        comments:
          type: string
          nullable: true
          maxLength: 5000
          example: null
        isOffer:
          type: boolean
          nullable: true
          description: Mark or unmark the order as an offer/quote.
          example: false
        isExternal:
          type: boolean
          nullable: true
          description: Mark or unmark the order as externally originated.
          example: false
        project_id:
          type: integer
          nullable: true
          description: Attach order to a different project.
          example: null
        address_id:
          type: integer
          nullable: true
          description: Existing account address ID to associate with the order.
          example: null
        client_id:
          type: integer
          nullable: true
          description: Reassign order to a different client by ID.
          example: null
        billing_account_id:
          type: integer
          nullable: true
          description: Alias for `client_id`; reassigns the billing client.
          example: null
        discount:
          type: number
          format: float
          nullable: true
          minimum: 0
          description: Global discount applied to the order total.
          example: null
        showTotal:
          type: boolean
          nullable: true
          description: Whether the order total is shown on printed documents.
          example: true
        showTax:
          type: boolean
          nullable: true
          description: Whether tax breakdown is shown on printed documents.
          example: true
    OrderDeleteResponse:
      type: object
      additionalProperties: false
      properties:
        success:
