        Create-supplier-invoice payload. Field names shown are the ones clients send; some are transformed server-side (see field descriptions).
      properties:
        invoice_type_id:
          type: integer
          nullable: true
          description: |
            invoice_types.id. May also be sent as `document_id` (alias); if both are present, `document_id` wins.
