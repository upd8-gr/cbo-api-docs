          in: query
          required: false
          description: Comma-separated subset of `name`, `short_name`, `peppol`. Invalid fields are ignored.
          schema:
            type: string
          example: name,short_name
        - name: category
          in: query
          required: false
          description: Single category or repeated array values. English and Greek aliases are normalized by the backend.
          style: form
          explode: true
          schema:
            oneOf:
              - type: string
              - type: array
                items:
                  type: string
          examples:
            single:
              value: general
            multiple:
              value:
                - general
                - βάρος
        - name: sort_by
          in: query
          required: false
          schema:
            type: string
            enum:
              - id
              - name
              - short_name
              - type
              - category
              - created_at
              - updated_at
          example: id
        - name: sort_order
          in: query
          required: false
          schema:
            type: string
            enum:
              - asc
              - desc
          example: asc
