      properties:
        name:
          type: string
          nullable: true
          maxLength: 255
        description:
          type: string
          nullable: true
          maxLength: 255
        group_id:
          type: integer
          nullable: true
          description: |
            Parent category id; must exist in `groups` for the company, be a valid category, and differ from the product's own id. Null / 0 means ungrouped.
        category_id:
          type: integer
          nullable: true
          description: Write-only alias for `group_id` (used only when `group_id` is not supplied).
        sort:
          type: integer
          minimum: 0
          maximum: 255
          nullable: true
