openapi: 3.0.3
info:
  title: CBO API v1.1
  version: '1.1'
  x-logo:
    url: ../assets/logo.png
    altText: Upd8.gr
  description: |
    CBO (Cloud Business Organiser) is a business management platform designed for Greek-market commercial operations.

    The CBO API provides secure, authenticated access to the core entities of the platform, allowing you to
    programmatically manage organisational data, commercial documents, and operational workflows.

    With the API you can:
    - Integrate external applications to automate business processes and synchronize data.
    - Connect your e-shop to CBO to manage products, orders, customers, and stock centrally.
    - Use CBO as your billing system, fully supporting AADE/MyData requirements and digital document circulation flows where applicable.

    All endpoints are company-scoped and require Bearer authentication.
    Responses follow consistent validation and pagination standards across the platform.

    ---

    ## Authentication

    All API requests must include a **Bearer token** in the `Authorization` header.

    **Example:**
    ```
    Authorization: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
    ```

    Obtain your token from your Profile page through the app [CBO](https://app.cbo.gr). 

    ---

    ## Authorisation

    Every request must include the company context via the **X-Asseblo-Company** header with the company ID.

    **Example:**
    ```
    X-Asseblo-Company: 123123123123
    ```

    Use the company ID that corresponds to the tenant you are acting on behalf of.

    ---

    ## Rate limits

    | Limit | Value |
    |-------|--------|
    | Per day | 1000 API calls |
    | Per minute | 60 requests |

    When a limit is exceeded, the API returns **HTTP 429 Too Many Requests**.
servers:
  - url: https://app.cbo.gr/api/v1.1
    description: CBO production
  - url: https://app.excelon.gr/api/v1.1
    description: CBO staging environment
security:
  - BearerAuth: []
  - XAssebloCompany: []
tags:
  - name: Invoices
  - name: Client Receipts
  - name: Supplier Invoices
  - name: Supplier Payments
  - name: Clients
  - name: Suppliers
  - name: Taxes
  - name: Invoice Types
  - name: Invoice Series
  - name: Product Children
  - name: Products
  - name: Groups
  - name: Measurement Units
  - name: Expense Categories
  - name: Tax Offices
  - name: Orders
  - name: Payment Links
  - name: Bank Details
  - name: Countries
paths:
  /orders:
    get:
      tags:
        - Orders
      summary: Orders (list)
      description: |
        Lists orders with optional search, filtering, sorting, and pagination. Response is always paginated and wrapped as `{success, data, meta}`.
      security:
        - BearerAuth: []
      parameters:
        - name: search
          in: query
          required: false
          description: Search term. Applied as a LIKE filter across the fields specified in `search_fields`.
          schema:
            type: string
            maxLength: 255
          example: Website
        - name: search_fields
          in: query
          required: false
          description: |
            Comma-separated list of fields to search in. Allowed values: `title`, `purchase_order`, `primary_id`.
          schema:
            type: string
          example: title,purchase_order
        - name: client_id
          in: query
          required: false
          description: Filter orders by client ID.
          schema:
            type: integer
          example: 5
        - name: is_offer
          in: query
          required: false
          description: Filter by offer flag. `true` returns only offers/quotes; `false` returns only standard orders.
          schema:
            type: boolean
          example: false
        - name: date_from
          in: query
          required: false
          description: Return only orders created on or after this date.
          schema:
            type: string
            format: date
          example: '2026-01-01'
        - name: date_to
          in: query
          required: false
          description: Return only orders created on or before this date. Must be ≥ `date_from`.
          schema:
            type: string
            format: date
          example: '2026-12-31'
        - name: sort_by
          in: query
          required: false
          schema:
            type: string
            enum:
              - id
              - title
              - created_at
              - updated_at
            default: id
          example: id
        - name: sort_order
          in: query
          required: false
          schema:
            type: string
            enum:
              - asc
              - desc
            default: desc
          example: desc
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
          example: 1
        - name: page_size
          in: query
          required: false
          description: Number of results per page (default 50, max 100).
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
          example: 50
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderIndexResponse'
              examples:
                default:
                  value:
                    success: true
                    data:
                      - id: 1
                        serial_number: '#1001'
                        title: Website redesign order
                        purchase_order: PO-2026-001
                        is_offer: false
                        is_external: false
                        client_id: 5
                        client: null
                        items: []
                        comments: null
                        project_id: null
                        created: '2026-04-27 09:00:00'
                        modified: '2026-04-27 10:00:00'
                    meta:
                      current_page: 1
                      last_page: 3
                      per_page: 50
                      total: 120
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      tags:
        - Orders
      summary: Order (create)
      description: |
        Creates a new order.
        **Client resolution precedence:**
        1. `client_id` supplied → attach existing client by ID. 2. `client.afm` (or `client.vat`) supplied → find by VAT within the company, or create a new company (B2B) client. `client.invoice_name` is required in this case. 3. `client.email` supplied → find by e-mail within the company, or create a new person (B2C) client.
        Exactly one of `client_id` or a `client` block must be provided.
        A `billing_address` is always required. A `shipping_address` is required only when dispatch details are provided.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderStore'
            examples:
              with_client_id:
                summary: Existing client by ID
                value:
                  client_id: 7
                  billing_address:
                    address: Σταδίου
                    number: '10'
                    town: Αθήνα
                    zip: '10562'
                    country: GR
                  title: B2B order
                  purchase_order: PO-2026-001
                  items:
                    - product_id: 42
                      quantity: 2
                      retail_price: 24.8
                      total_tax: 4.8
              new_company_client:
                summary: New company (B2B) client via VAT
                value:
                  client:
                    afm: '123456789'
                    invoice_name: ACME SA
                    company_name: ACME SA
                    client_type: 1
                    tax_office: Α Αθηνών
                  billing_address:
                    address: Ερμού
                    number: '5'
                    town: Αθήνα
                    zip: '10563'
                    country: GR
                  items:
                    - description: Custom service
                      quantity: 1
                      net_price: 100
                      taxes:
                        - 1
              new_person_client:
                summary: New person (B2C) client via email
                value:
                  client:
                    first_name: Giorgos
                    last_name: Papadopoulos
                    email: g@example.com
                    mobile: '6900000000'
                  billing_address:
                    address: Πανεπιστημίου
                    town: Αθήνα
                    zip: '10564'
                  items:
                    - product_id: 10
                      quantity: 1
                      retail_price: 31
                      total_tax: 6
                  shipping_items:
                    - title: Standard Shipping
                      price: 3.9
                      total_tax: 0.75
      responses:
        '201':
          description: Order created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderSingleResponse'
              example:
                success: true
                data:
                  id: 101
                  serial_number: '#1001'
                  title: null
                  purchase_order: null
                  is_offer: false
                  is_external: false
                  client_id: 5
                  client:
                    id: 5
                    invoice_name: ACME SA
                    company_name: ACME SA
                    vat: '123456789'
                  items: []
                  comments: null
                  project_id: null
                  created: '2026-04-27 10:00:00'
                  modified: '2026-04-27 10:00:00'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /orders/{id}:
    get:
      tags:
        - Orders
      summary: Order (show)
      description: Returns a single order by ID, including its client and line items.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderSingleResponse'
              example:
                success: true
                data:
                  id: 1
                  serial_number: '#1001'
                  title: Website redesign order
                  purchase_order: PO-2026-001
                  is_offer: false
                  is_external: false
                  client_id: 5
                  client:
                    id: 5
                    invoice_name: ACME SA
                    company_name: ACME SA
                    vat: '123456789'
                  items:
                    - id: 10
                      name: Custom Widget
                      quantity: 2
                      unit_price: 20
                      discount: 0
                  comments: null
                  project_id: null
                  created: '2026-04-27 09:00:00'
                  modified: '2026-04-27 10:00:00'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    put:
      tags:
        - Orders
      summary: Order (update replace)
      description: |
        Replaces updatable fields on an existing order. All fields are optional; only supplied fields are updated.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderUpdate'
            example:
              title: Updated order title
              purchase_order: PO-2026-002
              comments: Rush delivery requested.
              isOffer: false
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderSingleResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    patch:
      tags:
        - Orders
      summary: Order (update partial)
      description: |
        Partially updates an existing order. Identical behaviour to PUT — all fields are optional.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderUpdate'
            example:
              comments: Customer confirmed delivery date.
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderSingleResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    delete:
      tags:
        - Orders
      summary: Order (delete)
      description: Deletes an order. Fails with 422 if the order has related records that prevent deletion.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDeleteResponse'
              examples:
                deleted:
                  value:
                    success: true
                    message: Order deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: Cannot be deleted (has related records)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDeleteFailResponse'
              examples:
                fail:
                  value:
                    status: business_validation_error
                    message: Order cannot be deleted because it has related records.
                    errors: []
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /invoices:
    get:
      tags:
        - Invoices
      summary: Invoices (list)
      description: |
        Lists invoices with optional search and filtering.
        Response is paginated and wrapped as {success,data,meta}.
      security:
        - BearerAuth: []
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
          example: INV-2026
        - name: search_fields
          in: query
          required: false
          description: Comma-separated searchable fields.
          schema:
            type: string
          example: serial_number,nickname
        - name: serial_number
          in: query
          required: false
          schema:
            type: string
            maxLength: 255
        - name: date_from
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: date_to
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: status
          in: query
          required: false
          style: form
          explode: true
          schema:
            oneOf:
              - type: string
              - type: array
                items:
                  type: string
        - name: document_type
          in: query
          required: false
          style: form
          explode: true
          schema:
            oneOf:
              - type: string
              - type: array
                items:
                  type: string
        - name: client_id
          in: query
          required: false
          schema:
            type: integer
        - name: invoice_type_id
          in: query
          required: false
          description: invoice_type_id
          schema:
            type: integer
        - name: invoice_series_id
          in: query
          required: false
          schema:
            type: integer
        - name: sort_by
          in: query
          required: false
          schema:
            type: string
            enum:
              - id
              - serial_number
              - payment_date
              - created_at
              - updated_at
          example: payment_date
        - name: sort_order
          in: query
          required: false
          schema:
            type: string
            enum:
              - asc
              - desc
          example: desc
        - name: page
          in: query
          schema:
            type: integer
        - name: page_size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceIndexResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
        - Invoices
      summary: Invoice (create)
      description: |
        Creates a new invoice.
        Response is wrapped as {success,data}.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvoiceStore'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceSingleResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /invoices/{id}:
    get:
      tags:
        - Invoices
      summary: Invoice (show)
      description: |
        Shows an invoice by its ID.
        Response is wrapped as {success,data}.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceSingleResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /invoices/{id}/publish:
    post:
      tags:
        - Invoices
      summary: Publish draft invoice
      description: |
        Publishes a draft client invoice (`POST /api/v1.1/invoices/{id}/publish`).
        Loads the invoice with items, taxes, client, type, series, dispatch and payment methods, then runs the publish service.

        - If status is already `Executed` and `mydata_submit` is **false**, returns **422** with "Invoice is already published."
        - On validation or business errors after commit checks, may return **422** with the first alert message.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvoicePublishRequest'
            examples:
              default:
                value:
                  instant_receipt: true
                  mydata_submit: false
      responses:
        '200':
          description: Published — returns updated invoice resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceSingleResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: Validation error, already published, or publish blocked by business rules
          content:
            application/json:
              oneOf:
                - $ref: ../../../_shared/components/schemas/errors/ValidationError.yaml
                - $ref: ../../components/schemas/common/FailureMessageResponse.yaml
              examples:
                alreadyPublished:
                  value:
                    success: false
                    message: Invoice is already published.
                alertError:
                  value:
                    success: false
                    message: First error message from alerts.
        '500':
          description: Server error (unexpected failure during transaction)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FailureMessageResponse'
  /invoices/{id}/email:
    post:
      tags:
        - Invoices
      summary: Send email invoice
      description: |
        Sends the invoice (or offer, if document_type=estimate-offer) to the given email. Optionally stores the email in client's contact details.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvoiceEmailRequest'
            examples:
              default:
                value:
                  to: client@example.com
                  store_email: true
      responses:
        '200':
          description: Email sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceEmailResponse'
              examples:
                success:
                  value:
                    success: true
                    message: Email sent successfully
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /invoices/{id}/pdf/stream:
    get:
      tags:
        - Invoices
      summary: Stream invoice PDF (inline)
      description: |
        Generates the invoice PDF and returns it for inline display in the browser
        (`GET /api/v1.1/invoices/{id}/pdf/stream`). The response is sent with
        `Content-Disposition: inline` and rendered in "print" layout.

        If the invoice belongs to a different company than the `X-Asseblo-Company`
        header, a JSON **404** is returned instead of a PDF.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - name: connector
          in: query
          required: false
          description: |
            When truthy, returns the provider (myDATA connector) PDF image for the invoice instead of the locally generated document, when one exists.
          schema:
            type: boolean
        - name: unauthorized
          in: query
          required: false
          description: Internal flag altering how the invoice is resolved for public/unauthenticated access.
          schema:
            type: boolean
      responses:
        '200':
          description: Invoice PDF (inline)
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /invoices/{id}/pdf/download:
    get:
      tags:
        - Invoices
      summary: Download invoice PDF (attachment)
      description: |
        Generates the invoice PDF and returns it as a file download
        (`GET /api/v1.1/invoices/{id}/pdf/download`). The response is sent with
        `Content-Disposition: attachment; filename="<invoice-name>.pdf"`.

        If the invoice belongs to a different company than the `X-Asseblo-Company`
        header, a JSON **404** is returned instead of a PDF.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdPath'
        - name: connector
          in: query
          required: false
          description: |
            When truthy, returns the provider (myDATA connector) PDF image for the invoice instead of the locally generated document, when one exists.
          schema:
            type: boolean
        - name: unauthorized
          in: query
          required: false
          description: Internal flag altering how the invoice is resolved for public/unauthenticated access.
          schema:
            type: boolean
      responses:
        '200':
          description: Invoice PDF (attachment)
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /supplier-invoices:
    get:
      tags:
        - Supplier Invoices
      summary: Supplier invoices (list)
      description: |
        Lists supplier invoices with optional search and filtering.
        Response is paginated and wrapped as {success,data,meta}.
      security:
        - BearerAuth: []
      parameters:
        - name: search
          in: query
          required: false
          description: Search term (used only when search_fields is present).
          schema:
            type: string
          example: ΤΠΥ
        - name: search_fields
          in: query
          required: false
          description: |
            Comma-separated fields used in OR LIKE search. Allowed fields: `id`, `serial_number`, `status`, `document_type`, `nickname`.
          schema:
            type: string
          example: serial_number,status
        - name: serial_number
          in: query
          required: false
          schema:
            type: string
        - name: date_from
          in: query
          required: false
          description: Filters payment_date range (used with date_to).
          schema:
            type: string
            format: date
        - name: date_to
          in: query
          required: false
          description: Must be on or after date_from. Filters payment_date range (used with date_from).
          schema:
            type: string
            format: date
        - name: status
          in: query
          required: false
          description: Filter by one or more statuses.
          style: form
          explode: true
          schema:
            oneOf:
              - type: string
              - type: array
                items:
                  type: string
        - name: document_type
          in: query
          required: false
          description: Filter by one or more document types.
          style: form
          explode: true
          schema:
            oneOf:
              - type: string
              - type: array
                items:
                  type: string
        - name: supplier_id
          in: query
          required: false
          schema:
            type: integer
        - name: invoice_type_id
          in: query
          required: false
          schema:
            type: integer
        - name: invoice_series_id
          in: query
          required: false
          schema:
            type: integer
        - name: sort_by
          in: query
          required: false
          schema:
            type: string
            enum:
              - id
              - serial_number
              - payment_date
              - created_at
