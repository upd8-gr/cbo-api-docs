        - BearerAuth: []
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
            maxLength: 255
          description: Search value used with SQL `LIKE` across the fields listed in `search_fields`.
        - name: search_fields
          in: query
          required: false
          description: |
            Comma-separated subset of `id`, `product_name`, `primary_id`, `catalog_code`, `erp_code`, `barcode`. Invalid fields are rejected with a validation error.
          schema:
            type: string
            maxLength: 255
          example: product_name,barcode
        - name: group_id
          in: query
          required: false
          schema:
            type: integer
        - name: visibility
          in: query
          required: false
          description: Filter by visibility flag (0/1).
