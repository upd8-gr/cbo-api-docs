    ProductErrorResponse:
      type: object
      additionalProperties: false
      description: |
        Standard error envelope used by the Products endpoints. `status` is a machine-readable error code (`validation_error`, `business_validation_error`, `not_found`, `conflict`, `server_error`, `forbidden`). For `validation_error`, `errors` is a map of field name to an array of messages; for all other statuses `errors` is an empty array.
      properties:
        status:
          type: string
          example: validation_error
          enum:
            - validation_error
            - business_validation_error
            - not_found
            - conflict
            - server_error
            - forbidden
        message:
          type: string
          example: Validation failed.
        errors:
          description: Field-keyed validation messages for `validation_error`; otherwise an empty array.
          oneOf:
            - type: object
              additionalProperties:
                type: array
                items:
                  type: string
              example:
                name:
                  - The name field is required.
            - type: array
              items: {}
              example: []
      required:
        - status
        - message
        - errors
    ProductStore:
      type: object
      additionalProperties: false
      description: |
        Create a parent product (`StoreProductRequest`). The product is always created as a master group (`master = 1`) scoped to the company from `X-Asseblo-Company`. `category_id` is accepted as an alias for `group_id`; before validation the value is normalized so that `null`, `''`, or `0` become `null` (ungrouped). When provided, `group_id` must reference a group belonging to the company and must be a valid category (parent) per the catalog rules.
      properties:
        name:
          type: string
          maxLength: 255
        description:
          type: string
          nullable: true
          maxLength: 255
        group_id:
          type: integer
          nullable: true
          description: |
            Parent category id; must exist in `groups` for the company and be a valid category. Null / 0 means ungrouped.
        category_id:
          type: integer
          nullable: true
          description: Write-only alias for `group_id` (used only when `group_id` is not supplied).
        sort:
          type: integer
          minimum: 0
          maximum: 255
          nullable: true
      required:
        - name
    ProductSingleResponse:
      type: object
      additionalProperties: false
      properties:
