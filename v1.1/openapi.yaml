              examples:
                default:
                  value:
                    success: true
                    data:
                      id: 1166
                      title: Invoice (no delivery)
                      type: 1
                      aade_type: '1.1'
                      document_type: null
                      active: true
                      is_deliverable: false
                      default: true
                      template_id: null
                      company: 1
