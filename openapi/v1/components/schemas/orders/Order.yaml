type: object
additionalProperties: false
properties:
  id:
    type: integer
    format: int64
    example: 1
  serial_number:
    type: string
    example: "#1001"
  title:
    type: string
    example: "Order for Papadopoulos"
  billing_account:
    type: object
    nullable: true
    additionalProperties: true
    description: Client billing account object, if attached.
    example: null
  isOffer:
    type: boolean
    example: false
  isExternal:
    type: boolean
    example: true
  items:
    type: array
    description: >
      Order line items. Only present when items are loaded — always for
      `GET /orders/{order}`, and for `GET /orders` only when `withItems=true`.
    items:
      type: object
      additionalProperties: true
      properties:
        group:
          type: integer
          example: 12
        title:
          type: string
          nullable: true
          example: "Laptop 15\""
        description:
          type: string
          nullable: true
          example: null
        quantity:
          type: number
          example: 1
        measurment_unit:
          nullable: true
          example: "Τεμάχιο"
        unit_price:
          type: number
          example: 500.00
        discount_rate:
          type: number
          example: 0
        net_value:
          type: number
          example: 500.00
  comments:
    type: string
    nullable: true
    example: null
  updated:
    type: string
    example: "2026-04-27 10:00:00"
  created:
    type: string
    example: "2026-04-27 09:00:00"
required: [id, serial_number, title, billing_account, isOffer, isExternal, comments, updated, created]
