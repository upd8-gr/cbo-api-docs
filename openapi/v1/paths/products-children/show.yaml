get:
  tags: [Products Children]
  summary: Show product child
  security:
    - BearerAuth: []
  parameters:
    - name: child
      in: path
      required: true
      description: The ID of the product child.
      schema:
        type: integer
        format: int64
      example: 1

    - name: stock
      in: query
      required: false
      description: If provided, resource returns partial stock by the given value (backend-defined).
      schema: { type: string }
      example: "warehouse:1"

    - name: getGroupHierarchy
      in: query
      required: false
      description: If true, includes group hierarchy info in the resource.
      schema: { type: boolean, default: false }
      example: false

  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            properties:
              data:
                $ref: ../../components/schemas/products-children/ProductChild.yaml
            required: [data]
    "401": { $ref: ../../../_shared/components/responses/Unauthorized.yaml }
    "403": { $ref: ../../../_shared/components/responses/Forbidden.yaml }
    "404": { $ref: ../../../_shared/components/responses/NotFound.yaml }
