type: object
additionalProperties: false
description: >
  Standard error envelope used by the Products endpoints. `status` is a machine-readable error code
  (`validation_error`, `business_validation_error`, `not_found`, `conflict`, `server_error`, `forbidden`).
  For `validation_error`, `errors` is a map of field name to an array of messages; for all other statuses
  `errors` is an empty array.
properties:
  status:
    type: string
    example: validation_error
    enum:
      - validation_error
      - business_validation_error
      - not_found
      - conflict
      - server_error
      - forbidden
  message:
    type: string
    example: "Validation failed."
  errors:
    description: Field-keyed validation messages for `validation_error`; otherwise an empty array.
    oneOf:
      - type: object
        additionalProperties:
          type: array
          items: { type: string }
        example:
          name: ["The name field is required."]
      - type: array
        items: {}
        example: []
required: [status, message, errors]
