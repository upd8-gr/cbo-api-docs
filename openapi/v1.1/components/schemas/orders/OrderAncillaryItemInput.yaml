type: object
additionalProperties: false
description: >
  Ancillary item (fee or shipping charge). Normalised internally to a standard job item
  with quantity 1 and measure unit "Υπηρεσία".
properties:
  title:
    type: string
    maxLength: 255
    description: Item title/description.
    example: "Shipping fee"

  price:
    type: number
    format: float
    minimum: 0
    description: Unit price (gross).
    example: 5.00

  discount_percentage:
    type: number
    format: float
    nullable: true
    minimum: 0
    maximum: 100
    example: 0

  comments:
    type: string
    nullable: true
    maxLength: 1000
    example: null

  total_tax:
    type: number
    format: float
    nullable: true
    description: Total tax amount for this item.
    example: 1.20

required: [title, price]
