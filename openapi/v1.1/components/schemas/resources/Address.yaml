type: object
additionalProperties: true
description: Address output (AddressResource). Null fields are omitted from the response.
properties:
  address: { type: string, example: "Main street" }
  number: { type: string, nullable: true, example: "10" }
  zip: { type: string, description: "Postal code (maps from tk).", example: "10558" }
  city: { type: string, description: "Town/city (maps from town).", example: "Athens" }
  region: { type: string, nullable: true, example: "Attica" }
  country: { type: string, description: "ISO country code; '--' when unset.", example: "GR" }
  branch_code: { type: integer, nullable: true, example: 0 }
  address_type:
    type: string
    enum: [billing, shipping, else]
    description: "Derived from status (1=billing, 2=shipping, otherwise else)."
    example: "billing"
  default: { type: boolean, example: true }
