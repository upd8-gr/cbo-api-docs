# POST /bank-details — registers one of the company's own bank accounts.
#
# The owner is taken from the token, never from the body: this endpoint only ever creates
# accounts belonging to the authenticated company.
type: object
additionalProperties: false

properties:
  bank:
    type: string
    maxLength: 255
    description: >
      The bank's NAME. Matched case-insensitively against the banks already registered for
      your company, and registered if new. Send this or `bank_id`.
    example: Εθνική Τράπεζα

  bank_id:
    type: integer
    description: >
      An existing banks.id of your company. An id belonging to another company is rejected.
      Send this or `bank`.

  account_number: { type: string, nullable: true, maxLength: 255 }
  iban: { type: string, nullable: true, maxLength: 255, example: GR1601101250000000012300695 }
  swift: { type: string, nullable: true, maxLength: 255, example: ETHNGRAA }
  accounting_code: { type: string, nullable: true, maxLength: 255 }

  available:
    type: boolean
    nullable: true
    default: true

anyOf:
  - required: [bank]
  - required: [bank_id]
