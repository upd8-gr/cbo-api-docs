type: object
additionalProperties: false
description: >
  Update product child. Same fields as create where applicable; send only fields to change
  (`UpdateProductChildRequest` — rules align with store for company-scoped relations).
  `sku` is accepted and normalized into `catalog_code`; `catalog_code` is also accepted directly.
properties:
  product_name: { type: string, maxLength: 500 }
  measurement_unit_id: { type: integer }
  accounting_type: { type: integer, enum: [1, 2, 3, 4, 5, 6, 7] }
  tax_id:
    type: integer
    description: Must exist in `taxes` for the company from `X-Asseblo-Company`.
  tax_ids:
    type: array
    nullable: true
    items: { type: integer }
    description: Additional tax IDs; each must exist in `taxes` for the company and not be of `type` 1.
  group_id:
    type: integer
    nullable: true
    description: Product group; must belong to company if > 0. Send `-1` to normalize to `0`.
  expense_id:
    type: integer
    nullable: true
    description: Optional expense; must exist in `expenses` for the company.
  sku:
    type: string
    nullable: true
    maxLength: 255
    description: Preferred public SKU input; mapped to the internal `catalog_code` field before validation.
  catalog_code: { type: string, nullable: true, maxLength: 255 }
  cpv_code: { type: string, nullable: true, maxLength: 255 }
  accounting_code: { type: string, nullable: true, maxLength: 255 }
  cost_price: { type: number, nullable: true }
  sell_price: { type: number, nullable: true }
  sell_lock: { type: integer, enum: [0, 1], nullable: true }
  retail_price: { type: number, nullable: true }
  website_price: { type: number, nullable: true }
  discounted_price: { type: number, nullable: true }
  description: { type: string, nullable: true }
  barcode: { type: string, nullable: true, maxLength: 255 }
  special_rules: { type: integer, enum: [0, 1, 2], nullable: true }
  count_storage: { type: boolean, nullable: true }
  initial_stock: { type: number, nullable: true }
  branch_id:
    type: integer
    nullable: true
    description: It indicates the branch where the product is stored. Must exist in `branches` for the company.
  check_stock: { type: boolean, nullable: true }
  stock_alert: { type: number, nullable: true }
  characteristic_ids:
    type: array
    items: { type: integer }
    description: Characteristic IDs belonging to the company.
  supplier_ids:
    type: array
    items: { type: integer }
    description: Supplier IDs (non-courier suppliers for the company).
  suppliers:
    type: array
    items:
      type: object
      additionalProperties: false
      properties:
        supplier_id: { type: integer }
        supplier_code: { type: string, nullable: true, maxLength: 255 }
        supplier_name: { type: string, nullable: true, maxLength: 255 }
        product_cost: { type: number, nullable: true }
      required: [supplier_id]
  catalogues:
    type: array
    items:
      type: object
      additionalProperties: false
      properties:
        catalogue_id: { type: integer }
        ratio: { type: number, nullable: true }
      required: [catalogue_id]
  serial_numbers:
    type: array
    items: { type: string, maxLength: 255 }
  tiers:
    type: array
    description: >-
      Quantity-break prices. Replaces the whole set: every tier currently on the
      product is removed and these are written in its place. Ranges must not
      overlap each other. Omit the key to leave the existing tiers untouched;
      send an empty array to clear them.
    items:
      type: object
      additionalProperties: false
      required: [min_quantity, max_quantity, type, value]
      properties:
        min_quantity:
          type: number
          minimum: 0
          description: Lower bound of the quantity range, inclusive.
          example: 1
        max_quantity:
          description: >-
            Upper bound of the quantity range, inclusive. Use "*" or "infinity"
            for an open-ended top tier (stored as 99999999).
          oneOf:
            - type: number
            - type: string
              pattern: '^(\*|infinity|\d+(\.\d+)?)$'
          example: 10
        type:
          type: string
          enum: [fixed, unit_price, markup, discount]
          description: >-
            How `value` is interpreted — `fixed`: a fixed total for the line;
            `unit_price`: an absolute net price per unit; `markup`: a percentage
            added to the product's cost price; `discount`: a percentage taken
            off the product's sell price.
          example: unit_price
        value:
          type: number
          description: The amount or percentage, per `type`.
          example: 90
  tags:
    type: array
    items: { type: string, maxLength: 255 }
