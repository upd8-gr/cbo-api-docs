type: object
additionalProperties: false
description: Product child as returned by `ProductChildResource` (API v1.1). Null-valued fields may be omitted.
properties:
  id: { type: integer, format: int64, example: 1001 }
  product_name: { type: string, example: "Sample product" }
  description: { type: string, nullable: true }
  code: { type: string, nullable: true }

  images:
    type: array
    description: Product images. Empty array when there are no images.
    items:
      type: object
      additionalProperties: false
      properties:
        id: { type: integer, example: 42 }
        thumb: { type: string, nullable: true, example: null }
        normal: { type: string, nullable: true, example: null }
        isDefault: { type: boolean, example: false }
      required: [id, thumb, normal, isDefault]

  measurement_unit_name: 
    type: string
    description: Present when `measurement_unit` name
    example: "Τεμάχιο"
  measurement_unit_id: { type: integer, nullable: true }
  
  tax_percentage:
    type: number
    nullable: true
    description: Tax rate from related tax record (`tax.value`).
    example: 24
  tax_id: { type: integer, nullable: true }
  additional_tax_ids:
    type: array
    description: IDs of additional taxes. Present when the `taxes` relation is loaded (single-item responses).
    items: { type: integer }

  cost_price: { type: number, nullable: true }
  sell_price: { type: number, nullable: true }
  retail_price: { type: number, nullable: true }
  website_price: { type: number, nullable: true }
  discounted_price: { type: number, nullable: true }
  builded_price: { type: number, nullable: true }
  
  stock:
    nullable: true
    description: Full stock output by default, or partial stock output when the `stock` query parameter is used on the list endpoint.
    oneOf:
      - type: number
        example: 12
      - type: object
        additionalProperties: true
  stock_alert: { type: number, nullable: true }
  count_storage:
    type: boolean
    nullable: true
    description: Whether storage counting is enabled for the product.

  parent_name: { type: string, nullable: true, example: "Parent Product" }
  group_id: { type: integer, nullable: true, example: 5 }
  group_hierarchy: { type: string, nullable: true, example: "Group A / Group B / Group C" }
  
  accounting_type: { type: integer, enum: [1, 2, 3, 4, 5, 6, 7], example: 1 }
  visibility: { type: boolean, example: true }
  on_website: { type: boolean, example: true, description: Whether the product is shown on the website. }
  barcode: { type: string, nullable: true }
  sku:
    type: string
    nullable: true
    description: Public SKU value returned from the internal `catalog_code` field.
    example: "SKU-001"
  erp_code: { type: string, nullable: true }
  cpv_code: { type: string, nullable: true, maxLength: 255 }
  expense_id: { type: integer, nullable: true }

  company: { type: integer, example: 1 }
  created: { type: string, example: "2026-02-11 10:00:00" }
  modified: { type: string, example: "2026-02-11 10:00:00" }

  tags:
    type: array
    description: Tag names
    items: { type: string }
  characteristics:
    type: array
    items:
      $ref: ../../../../v1/components/schemas/resources/Characteristic.yaml
  tiers:
    type: array
    items:
      $ref: ../../../../v1/components/schemas/resources/Tier.yaml
  catalogues:
    type: array
    items:
      $ref: ../../../../v1/components/schemas/resources/Catalogue.yaml
required:
  - id
  - product_name
  - created
  - modified
