type: object
additionalProperties: false
description: >
  Partial update payload. Unlike create, this request does NOT remap `vat`/`expense_category_id`;
  send `vat` and `expense_id` directly. It also accepts a single address object (not an array)
  for `billing_address`/`shipping_address`.
properties:
  invoice_name: { type: string, nullable: true, maxLength: 255 }
  vat:
    type: string
    nullable: true
    maxLength: 20
    description: VAT number.

  company_name: { type: string, nullable: true, maxLength: 255 }
  profession: { type: string, nullable: true, maxLength: 255 }

  # contact (mapped to the default contact of the supplier)
  first_name: { type: string, nullable: true, maxLength: 255 }
  last_name: { type: string, nullable: true, maxLength: 255 }
  email: { type: string, nullable: true, format: email }
  phone: { type: string, nullable: true, maxLength: 50 }
  mobile: { type: string, nullable: true, maxLength: 50 }
  fax: { type: string, nullable: true, maxLength: 50 }

  tax_office: { type: string, nullable: true, maxLength: 255 }
  tax_offices_id: { type: integer, format: int64, nullable: true }

  expense_category_id:
    type: integer
    format: int64
    nullable: true
    description: Expense category id (exists:expenses,id).

  comments: { type: string, nullable: true, maxLength: 1000 }

  billing_address:
    oneOf:
      - $ref: ../clients/ClientAddressInputObject.yaml
      - type: "null"
    nullable: true

  shipping_address:
    oneOf:
      - $ref: ../clients/ClientAddressInputObject.yaml
      - type: "null"
    nullable: true

  tag:
    type: array
    nullable: true
    items: { type: string }
