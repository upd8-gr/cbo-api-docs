type: object
additionalProperties: false
properties:
  invoice_name:
    type: string
    maxLength: 255
    example: "Supplier SA"
  vat:
    type: string
    maxLength: 20
    description: Mapped to the `afm` column.
    example: "123456789"

  company_name:
    type: string
    nullable: true
    maxLength: 255
    example: "Supplier SA"
  profession:
    type: string
    nullable: true
    maxLength: 255
    example: "Wholesale"

  # contact (mapped to the default contact of the supplier)
  first_name:
    type: string
    nullable: true
    maxLength: 255
    example: "Nikos"
  last_name:
    type: string
    nullable: true
    maxLength: 255
    example: "Supplier"
  email:
    type: string
    nullable: true
    format: email
    example: "s@example.com"
  phone:
    type: string
    nullable: true
    maxLength: 50
    example: "2100000000"
  mobile:
    type: string
    nullable: true
    maxLength: 50
    example: null
  fax:
    type: string
    nullable: true
    maxLength: 50
    example: null

  tax_office:
    type: string
    nullable: true
    maxLength: 255
    example: "Α Αθηνών"
  tax_offices_id:
    type: integer
    format: int64
    nullable: true
    example: 10
  tax_type:
    type: integer
    nullable: true
    enum: [1, 2, 3]
    example: 1
  payment_way:
    type: string
    nullable: true
    enum: [cash, on-credit]
    example: "cash"

  expense_category_id:
    type: integer
    format: int64
    nullable: true
    description: Mapped to the `expense_id` column (exists:expenses,id).
    example: 10

  comments:
    type: string
    nullable: true
    maxLength: 1000
    example: null

  billing_address:
    $ref: ../clients/ClientAddressInput.yaml

  shipping_address:
    oneOf:
      - $ref: ../clients/ClientAddressInput.yaml
      - type: "null"
    nullable: true

  tag:
    type: array
    nullable: true
    items: { type: string }
    example: ["vip", "b2b"]
required:
  - invoice_name
  - vat
