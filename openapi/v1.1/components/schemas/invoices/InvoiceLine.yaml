type: object
additionalProperties: false
properties:
  id: { type: integer }
  product_id: { type: integer, nullable: true }
  description: { type: string, nullable: true }
  quantity: { type: number }
  measure_unit: { type: string }
  unit_price: { type: number }
  discount_price: { type: number, nullable: true }
  net_amount: { type: number }
  taxes:
    type: array
    items:
      $ref: ../taxes/TaxForInvoiceLine.yaml
  classificationCategory:
    type: string
    nullable: true
  classificationType:
    type: string
    nullable: true
  vatExemptionCategory:
    type: integer
    nullable: true
  cpv_code:
    type: string
    nullable: true
required:
  - id
  - quantity
