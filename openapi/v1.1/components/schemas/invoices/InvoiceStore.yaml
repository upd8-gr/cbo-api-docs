type: object
additionalProperties: false
description: >
  Create-invoice payload, as the client sends it. Send either `billing_address` or
  `billing_address_id`.
properties:

  invoice_type_id:
    type: integer
    nullable: true
    description: >
      Optional. When provided its `document_type` must match the posted `document_type`
      (an `invoice` posted with an income type is matched as described under
      `document_type`). When omitted the company's default type for the document type is
      used. May also be sent as `document_id` (alias); if both are present, `document_id`
      wins.

  document_id:
    type: integer
    nullable: true
    description: Alias of `invoice_type_id`; wins when both are sent.
  invoice_series_id:
    type: integer
    nullable: true

  mydata_type:
    type: string
    nullable: true
    maxLength: 10

  serial_number:
    type: integer
    nullable: true

  date:
    type: string
    format: date

  due_date:
    type: string
    format: date
    nullable: true

  client_id:
    type: integer

  document_type:
    type: string
    description: |
      Legacy names and income documents are normalised before validation:
      - `cash-register` (deprecated) is accepted and stored as `retail`; filter on either
        name in `GET /invoices`.
      - `cancel-register` (deprecated) is renamed to `credit-retail`, which this endpoint
        does not create, so it is refused with 422 (it is not in the list below).
      - `invoice` with an income type — an `invoice_type_id` whose document type is
        `invoice-income` / `accommodation-income`, or (without a type) `mydata_type`
        7.1 / 8.1 / 8.2 — is created as `invoice-income` (7.1, 8.1) or
        `accommodation-income` (8.2). Those two names can also be sent directly.
    enum:
      - invoice
      - credit-invoice
      - invoice-income
      - accommodation-income
      - retail
      - cash-receipt
      - return
      - delivery-note
      - delivery-return
      - estimate-offer
      - cash-register
    example: invoice

  template_id:
    type: integer
    nullable: true

  vat_payment_suspension:
    type: boolean
    nullable: true

  grand_total:
    type: number
    minimum: 0

  billing_address:
    description: >
      Single address object. account linkage is
      injected automatically from `client_id`. Required unless `billing_address_id` is sent.
    $ref: ../clients/ClientAddressInputObject.yaml

  billing_address_id:
    type: integer
    description: >
      id of an existing address of the client, instead of `billing_address` (the two
      cannot be combined).

  shipping_address_id:
    type: integer
    description: id of an existing address, instead of `shipping_address` (cannot be combined).

  loading_address_id:
    type: integer
    description: id of an existing address, instead of `loading_address` (cannot be combined).

  shipping_address:
    nullable: true
    description: >
      Single address object.
    $ref: ../clients/ClientAddressInputObject.yaml

  loading_address:
    nullable: true
    description: Single address object. Required on invoices with delivery.
    $ref: ../clients/ClientAddressInputObject.yaml

  dispatch_date:
    type: string
    format: date
    nullable: true
    description: Required on invoices with delivery.

  dispatch_time:
    type: string
    nullable: true
    description: Required on invoices with delivery.

  vehicle_number:
    type: string
    nullable: true
    maxLength: 50
    description: Required on invoices with delivery.

  move_purpose:
    type: integer
    nullable: true
    description: |
      - 1: Πώληση
      - 2: Πώληση για Λογαριασμό Τρίτων
      - 3: Δειγματισμός
      - 4: Έκθεση
      - 5: Επιστροφή
      - 6: Φύλαξη
      - 7: Επεξεργασία - Συναρμολόγηση - Αποσυναρμολόγηση
      - 8: Ενδοδιακίνηση
      - 9: Αγορά
      - 10: Εφοδιασμός πλοίων και αεροσκαφών
      - 11: Δωρεάν διάθεση
      - 12: Εγγύηση
      - 13: Χρησιδανεισμός
      - 14: Αποθήκευση σε Τρίτους
      - 15: Επιστροφή από Φύλαξη
      - 16: Ανακύκλωση
      - 17: Καταστροφή άχρηστου υλικού
      - 18: Διακίνηση Παγίων (Ενδοδιακίνηση)
      - 19: Λοιπές Διακινήσεις
      - 20: Μεταφορές – Ταχυμεταφορές

  other_move_purpose_title:
    type: string
    nullable: true
    maxLength: 255
    description: When move_purpose is 19, this field is required.

  items:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [quantity]
      properties:
        product_id: { type: integer, nullable: true }
        description: { type: string, nullable: true }
        quantity:
          type: number
          minimum: 0.001
        measure_unit:
          type: string
          nullable: true
          maxLength: 255
          description: >
            The unit written as free text. Matched against the company's measurement
            units by name, short name, plural, common abbreviation, english wording and
            peppol code, ignoring case, accents and trailing dots — so "Τεμάχια",
            "τεμ.", "pcs" and "C62" all reach the same unit. A bare number is read as
            the myDATA unit code. When nothing matches close enough the line falls back
            to the product's unit and then to the company's default unit ("Τεμάχιο"):
            an unrecognised spelling is never an error.
          example: τεμ.
        measurement_unit_id:
          type: integer
          nullable: true
          description: >
            measurement_units.id — takes precedence over `measure_unit`. Ignored (and
            resolved as if absent) when the id belongs to another company.
        unit_price:
          type: number
          nullable: true
          minimum: 0
        discount_percentage:
          type: number
          nullable: true
          minimum: 0
          maximum: 100
        taxes:
          type: array
          nullable: true
          items: { type: integer }
        mydata_classification_category:
          type: string
          nullable: true
          maxLength: 255
        mydata_classification_type:
          type: string
          nullable: true
          maxLength: 255
        vat_exemption_category:
          type: integer
          nullable: true
        cpv_code:
          type: string
          nullable: true
          maxLength: 255

  taxes:
    type: array
    nullable: true
    items: { type: integer }

  payment_methods:
    type: array
    nullable: true
    description: Required when `payment_way` is `cash`; otherwise prohibited.
    items:
      type: object
      additionalProperties: false
      properties:
        paymentMethod:
          type: integer
          enum: [1,2,3,4,6,7,8]
          description: |
            Available only when myDATA integration is enabled.

            Values:
            - 1: Domestic Payments Account
            - 2: Foreign Payments Account
            - 3: Cash
            - 4: Cheque
            - 6: Web Banking
            - 7: POS / e-POS
            - 8: IRIS Direct Payment
        paymentAmount:
          type: number
          minimum: 0
        terminal_id:
          type: integer
          nullable: true
          description: terminal_id from CBO (terminals table). Only available when paymentMethod is 7 (POS / e-POS).
        tip:
          type: number
          nullable: true
          description: Tip amount. Only available when paymentMethod is 7 (POS / e-POS).
        instalments:
          type: integer
          nullable: true
          minimum: 0
          description: Number of instalments. Only available when paymentMethod is 7 (POS / e-POS).
        paymentMethodInfo:
          type: string
          nullable: true
          maxLength: 255

  related_documents:
    type: array
    nullable: true
    description: >
      ids of your company's client documents this invoice relates to (e.g. a receipt, a
      credited invoice, a delivery note). `related_documents` and `delivery_notes` are
      merged on store: each id becomes a header-level link (no line quantities or stock
      are moved). In the response a linked `delivery-note` / `delivery-return` is listed
      under `delivery_notes`, everything else under `related_documents`, whichever key it
      was sent in. An id of another company's document is refused with 422
      (`errors.related_documents.N`).
    items: { type: integer, description: clients_invoices.id of your company }

  delivery_notes:
    type: array
    nullable: true
    description: >
      Same as `related_documents` (the two lists are merged). Another company's id is
      refused with 422 (`errors.delivery_notes.N`).
    items: { type: integer, description: clients_invoices.id of your company }
  
  terms:
    type: string
    nullable: true
    maxLength: 1000

  notes:
    type: string
    nullable: true
    maxLength: 1000

  payment_way:
    type: string
    nullable: true
    enum: [cash, on-credit]

  currency_code:
    type: string
    nullable: true
    maxLength: 3

  currency_rate:
    type: number
    nullable: true
    minimum: 0

  branch_id:
    type: integer
    nullable: true

  isDraft:
    type: boolean
    nullable: true

  mydata_submit:
    type: boolean
    nullable: true

required:
  - date
  - client_id
  - document_type