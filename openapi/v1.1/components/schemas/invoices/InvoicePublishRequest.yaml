type: object
additionalProperties: false
description: Optional flags for publishing a draft invoice. Boolean fields accept true/false, 1/0 and "1"/"0".
properties:
  instant_receipt:
    type: boolean
    default: true
    description: Book a receipt for each paid payment method on publish (default true).
    example: true
  mydata_submit:
    type: boolean
    default: false
    description: >
      Transmit to myDATA on publish (skipped when the company has no myDATA settings).
      On an invoice already `Executed` it retries the transmission only; without it an
      `Executed` invoice returns 422 "Invoice is already published."
    example: false
