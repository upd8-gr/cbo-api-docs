type: object
additionalProperties: false
description: >
  Client invoice (ClientsInvoiceResource output). Null fields are omitted, so any
  nullable property may be absent. The resource has no `document_type` key.
properties:
  id: { type: integer }

  representation:
    type: string
    nullable: true

  status:
    type: string
    example: "published"

  document_title:
    type: string
    nullable: true

  invoice_type_id:
    type: integer
    nullable: true

  serial_number:
    type: integer
    nullable: true

  invoice_series:
    type: string
    nullable: true

  mydata_type:
    type: string
    nullable: true

  date:
    type: string
    format: date

  due_date:
    type: string
    format: date
    nullable: true

  client_id:
    type: integer

  client:
    $ref: ../clients/ClientForInvoiceResponse.yaml

  billing_address:
    $ref: ../resources/Address.yaml

  shipping_address:
    nullable: true
    $ref: ../resources/Address.yaml

  loading_address:
    nullable: true
    $ref: ../resources/Address.yaml

  payment_method:
    type: string
    nullable: true

  payment_way:
    type: string
    nullable: true
    description: >
      The payment method as a slug (the stored label resolved to its type), e.g. `cash`,
      `bank`, `credit-card`, `check`, `iris`, `courier`. Omitted when the stored label maps
      to no known slug. Unlike `payment_method` above — which only reports Επί Πιστώσει /
      Τοις Μετρητοίς, derived from the due date — this is the actual method.
    example: cash

  allocations:
    type: array
    nullable: true
    description: >
      Present on documents fetched with their allocations: what this document settles,
      or what settles it, with the amount per document.
    items:
      type: object
      properties:
        invoice_id:
          type: integer
        amount:
          type: string
          description: Decimal string, e.g. "60.00".

  pos_tid:
    type: string
    nullable: true

  items:
    type: array
    items:
      $ref: ./InvoiceLine.yaml

  sub_total:
    type: number

  tax_total:
    type: number

  grand_total:
    type: number

  currency_code:
    type: string
    nullable: true

  currency_rate:
    type: number
    nullable: true

  terms:
    type: string
    nullable: true

  notes:
    type: string
    nullable: true

  related_documents:
    type: array
    description: >
      Always present (may be empty). ids of the documents linked to this one — receipts,
      returns, credit invoices and other header-level links — EXCEPT delivery notes:
      a linked `delivery-note` or `delivery-return` is listed under `delivery_notes`
      instead (since 2026-11-03), even when it was sent under `related_documents`.
      `delivery-centralized` and `delivery-internal` links stay here. Each id appears once.
    items: { type: integer }
    example: [1043]

  delivery_notes:
    type: array
    description: >
      Always present (may be empty). ids of the delivery notes (`delivery-note`,
      `delivery-return`) this invoice is linked to, whether through its lines or a
      header-level link. Each id appears once.
    items: { type: integer }
    example: [1038]

  created:
    type: string
    format: date-time
    nullable: true

  modified:
    type: string
    format: date-time
    nullable: true

  public_link:
    type: string
    nullable: true

  mydata_qr_code:
    type: string
    nullable: true

  mydata_latest_mark:
    type: string
    nullable: true

  mydata_uid:
    type: string
    nullable: true

required:
  - id
  - related_documents
  - delivery_notes
  - date
  - client_id
  - sub_total
  - tax_total
  - grand_total