type: object
additionalProperties: false
description: >
  Supplier invoice (SuppliersInvoiceResource output). Null fields are stripped
  from the response, so any nullable property may be absent.
properties:
  id: { type: integer, format: int64, example: 1 }

  representation:
    type: string
    nullable: true
    description: >
      Human-readable name of the document. On a registered purchase it is the
      `representation` that was sent, or the default counterparty title + series + number.
      On an issued document it is built from our invoice type, series and number.
    example: "Τιμολόγιο Πώλησης #Α-44"

  status:
    type: string
    description: Document status, e.g. `Draft`, `Executed`.
    example: "Executed"

  is_self_issued:
    type: boolean
    description: >
      Always present. `false` for a registered purchase (the supplier's document),
      `true` for a document we issued.
    example: false

  document_title:
    type: string
    nullable: true
    description: Title of the related invoice type.
    example: "Τιμολόγιο Παροχής Υπηρεσιών"

  invoice_type_id:
    type: integer
    nullable: true
    description: Our invoice type. `0` on a registered purchase (no type of ours).
    example: 0

  serial_number:
    type: integer
    nullable: true
    example: 1

  invoice_series_id:
    type: integer
    nullable: true
    description: >
      id of our invoice series — only on documents we issued with a series. Omitted when
      null (e.g. on every registered purchase). Before 2026-11-03 this key carried the
      stored series text, which could be the counterparty's free-text series; that text
      is now returned in `invoice_series`.
    example: 3

  invoice_series:
    type: string
    nullable: true
    description: >
      The series as text: the name of our series on an issued document, or the
      counterparty's free-text series on a registered purchase. Omitted when null.
    example: "Α"

  mydata_type:
    type: string
    nullable: true
    example: "13.1"

  date:
    type: string
    description: Raw payment_date value, `YYYY-MM-DD HH:MM:SS`.
    example: "2026-02-11 00:00:00"

  due_date:
    type: string
    format: date
    nullable: true
    example: "2026-03-11"

  supplier_id:
    type: integer
    format: int64
    example: 7

  supplier:
    $ref: ../suppliers/Supplier.yaml

  billing_address:
    $ref: ../resources/Address.yaml

  shipping_address:
    $ref: ../resources/Address.yaml

  loading_address:
    $ref: ../resources/Address.yaml

  payment_method:
    type: string
    nullable: true
    example: null

  payment_way:
    type: string
    nullable: true
    description: >
      The payment method as a slug (the stored label resolved to its type), e.g. `cash`,
      `bank`, `credit-card`, `check`, `iris`, `courier`. Omitted when the stored label maps
      to no known slug. Unlike `payment_method` above — which only reports Επί Πιστώσει /
      Τοις Μετρητοίς, derived from the due date — this is the actual method.
    example: cash

  dispatch_detail:
    type: object
    nullable: true
    description: >
      Movement fields of a delivery document. Present only when at least one of them is
      set; null fields inside are omitted.
    properties:
      dispatchDateTime: { type: string, example: "2026-11-03 10:00:00" }
      movePurpose: { type: integer, example: 1 }
      movePurposeTitle: { type: string, example: "Πώληση" }
      otherMovePurposeTitle: { type: string }
      reverseDeliveryNotePurpose: { type: integer }
      reverseDeliveryNotePurposeTitle: { type: string }
      vehicleNumber: { type: string, example: "ΙΚΑ1234" }
      transferStatus: { type: string }
      withoutDigitalTransportTracking: { type: boolean, description: Present only when true. }
      nonObligatedRecipient: { type: boolean, description: Present only when true. }

  allocations:
    type: array
    nullable: true
    description: >
      Present on documents fetched with their allocations: what this document settles,
      or what settles it, with the amount per document.
    items:
      type: object
      properties:
        invoice_id:
          type: integer
        amount:
          type: string
          description: Decimal string, e.g. "60.00".

  items:
    type: array
    items:
      $ref: ./SupplierInvoiceLine.yaml

  sub_total:
    type: number
    example: 200

  tax_total:
    type: number
    description: Total tax amount.
    example: 48

  grand_total:
    type: number
    example: 248

  currency_code:
    type: string
    nullable: true
    example: "EUR"

  exchange_rate:
    type: number
    nullable: true
    description: Currency exchange rate.
    example: 1

  terms:
    type: string
    nullable: true
    example: null

  notes:
    type: string
    nullable: true
    example: null

  created:
    type: string
    description: created_at timestamp.
    example: "2026-02-11 10:00:00"

  modified:
    type: string
    description: updated_at timestamp.
    example: "2026-02-12 10:00:00"

  public_link:
    type: string
    nullable: true
    description: Permanent public link to the invoice.
    example: "https://app.example.com/p/abc123"

  mydata_qr_code:
    type: string
    nullable: true
    example: null

  mydata_latest_mark:
    type: string
    nullable: true
    example: null

  mydata_uid:
    type: string
    nullable: true
    example: null

required:
  - id
  - is_self_issued
