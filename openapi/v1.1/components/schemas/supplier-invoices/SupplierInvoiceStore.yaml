type: object
additionalProperties: false
description: >
  Create-supplier-invoice payload. Field names shown are the ones clients send;
  some are transformed server-side (see field descriptions).
properties:

  invoice_type_id:
    type: integer
    nullable: true
    description: >
      invoice_types.id. May also be sent as `document_id` (alias); if both are
      present, `document_id` wins.
    example: 12

  mydata_type:
    type: string
    nullable: true
    maxLength: 10
    example: "13.1"

  serial_number:
    type: integer
    nullable: true
    example: 1

  invoice_series_id:
    type: integer
    nullable: true
    description: invoice_series.id
    example: 3

  date:
    type: string
    format: date
    description: Invoice date. Sent as `date`, validated internally as payment_date.
    example: "2026-02-11"

  due_date:
    type: string
    format: date
    nullable: true
    description: Must be on or after `date`.
    example: "2026-03-11"

  supplier_id:
    type: integer
    description: suppliers.id
    example: 7

  document_type:
    type: string
    enum:
      - invoice
      - credit-invoice
      - cash-receipt
      - return
      - delivery-note
      - delivery-return
      - cash-register
      - delivery-internal

  grand_total:
    type: number
    minimum: 0

  billing_address:
    description: >
      Single address object. Account linkage (account_id/account_type) is
      injected automatically from `supplier_id`. Send `zip`; it is stored as tk.
    $ref: ../clients/ClientAddressInputObject.yaml

  shipping_address:
    nullable: true
    description: >
      Single address object. Required when dispatch details are present.
    $ref: ../clients/ClientAddressInputObject.yaml

  loading_address:
    nullable: true
    description: Single address object.
    $ref: ../clients/ClientAddressInputObject.yaml

  dispatch_date:
    type: string
    format: date
    nullable: true
    description: Combined with dispatch_time into the dispatch details (delivery invoices).

  dispatch_time:
    type: string
    nullable: true
    description: Combined with dispatch_date into the dispatch details (delivery invoices).

  vehicle_number:
    type: string
    nullable: true
    maxLength: 50

  move_purpose:
    type: integer
    nullable: true
    description: myDATA move purpose code.

  other_move_purpose_title:
    type: string
    nullable: true
    maxLength: 255

  items:
    type: array
    nullable: true
    items:
      type: object
      additionalProperties: false
      description: >
        Each item must provide either product_id or description, and either
        product_id or measure_unit / measurement_unit_id.
      properties:
        product_id:
          type: integer
          nullable: true
          description: products_children.id
        description:
          type: string
          nullable: true
          maxLength: 255
        quantity:
          type: number
          minimum: 0.001
          description: Required when items is present.
        measure_unit:
          type: string
          nullable: true
          maxLength: 255
        measurement_unit_id:
          type: integer
          nullable: true
          description: measurement_units.id
        unit_price:
          type: number
          nullable: true
          minimum: 0
        discount_percentage:
          type: number
          nullable: true
          minimum: 0
          maximum: 100
        taxes:
          type: array
          nullable: true
          items: { type: integer, description: taxes.id }
        mydata_classification_category:
          type: string
          nullable: true
          maxLength: 255
          description: myDATA classification category. Required when mydata_submit is set.
        mydata_classification_type:
          type: string
          nullable: true
          maxLength: 255
          description: myDATA classification type. Required when mydata_submit is set.
        vat_exemption_category:
          type: integer
          nullable: true

  taxes:
    type: array
    nullable: true
    items: { type: integer, description: taxes.id }

  payment_methods:
    type: array
    nullable: true
    description: Required when `payment_way` is `cash`; otherwise prohibited.
    items:
      type: object
      additionalProperties: false
      properties:
        paymentMethod:
          type: integer
          enum: [1, 2, 3, 4, 6, 7, 8]
          description: |
            Values:
            - 1: Domestic Payments Account
            - 2: Foreign Payments Account
            - 3: Cash
            - 4: Cheque
            - 6: Web Banking
            - 7: POS / e-POS
            - 8: IRIS Direct Payment
        paymentAmount:
          type: number
          minimum: 0
        terminal_id:
          type: integer
          nullable: true
          description: terminal_id from CBO (terminals table). Typically for paymentMethod 7 (POS / e-POS).
        instalments:
          type: integer
          nullable: true
          minimum: 0
        tip:
          type: number
          nullable: true
          minimum: 0
        paymentMethodInfo:
          type: string
          nullable: true
          maxLength: 255

  terms:
    type: string
    nullable: true
    maxLength: 1000

  notes:
    type: string
    nullable: true
    maxLength: 1000

  payment_way:
    type: string
    nullable: true
    enum: [cash, on-credit]

  currency_code:
    type: string
    nullable: true
    maxLength: 3

  branch_id:
    type: integer
    nullable: true
    description: branches.id

  isDraft:
    type: boolean
    nullable: true

  mydata_submit:
    type: boolean
    nullable: true

required:
  - date
  - supplier_id
  - document_type
  - billing_address
