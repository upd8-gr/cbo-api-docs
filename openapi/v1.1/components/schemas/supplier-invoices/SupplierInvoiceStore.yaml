type: object
additionalProperties: false
description: |
  Create-supplier-invoice payload. Field names shown are the ones clients send;
  some are transformed server-side (see field descriptions).

  **Register a purchase vs issue our own document.** For the document types
  `invoice`, `credit-invoice`, `delivery-note`, `delivery-return` and
  `delivery-internal` the request works in one of two modes, chosen by `is_self_issued`:

  | | Register a purchase (`is_self_issued` false or omitted — the default) | Issue our own document (`is_self_issued: true`) |
  |---|---|---|
  | `invoice_type_id` / `document_id` | **prohibited** (422) | **required** — one of our invoice types for the supplier side whose `document_type` matches |
  | `invoice_series_id` | **prohibited** (422) | optional — one of our series |
  | `invoice_series` (free text) | optional — the counterparty's series | **prohibited** (422) |
  | `representation` | optional — free-text name of the document | **prohibited** (422) |
  | `serial_number` | optional — the counterparty's number, stored as sent, never checked for duplicates | optional — when omitted the document is numbered on publish; when sent it must not already be held in its numbering scope |
  | `mydata_submit: true` | refused (422) — a purchase is the supplier's document | transmits to myDATA on publish |

  `cash-receipt`, `return` and `retail` (alias `cash-register`) are money movements and
  are neither: none of the rules above apply to them.

  `counterparty_document_type_id` (briefly present on pre-release builds) is not part of
  the contract; if sent it is ignored.
properties:

  is_self_issued:
    type: boolean
    nullable: true
    default: false
    description: >
      `false` (default) registers a purchase you received from the supplier; `true` issues
      a document of your own (e.g. a self-billing invoice or a delivery note you send) with
      your invoice type and numbering. See the table above.
    example: false

  representation:
    type: string
    nullable: true
    maxLength: 255
    description: >
      Register only — prohibited when `is_self_issued` is true. Free-text name of the
      registered document, returned as `representation`. When omitted it is built from
      the company's default counterparty title for the `document_type` plus
      `invoice_series` and `serial_number` (e.g. "Τιμολόγιο Πώλησης #Α-44"), or
      "Παραστατικό" when no title is configured.
    example: "Τιμολόγιο ΔΕΗ 44"

  invoice_type_id:
    type: integer
    nullable: true
    description: >
      Issue only (`is_self_issued: true`), where it is required: an invoice_types.id of
      your company, usable on the supplier side (`account` supplier or both), whose
      `document_type` equals the posted `document_type`. When registering it is refused
      with 422 "invoice_type_id is only accepted when is_self_issued is true.".
      May also be sent as `document_id` (alias); if both are present, `document_id` wins.
    example: 12

  document_id:
    type: integer
    nullable: true
    description: Alias of `invoice_type_id`; wins when both are sent. Same rules.
    example: 12

  mydata_type:
    type: string
    nullable: true
    maxLength: 10
    description: >
      myDATA document type. When issuing it defaults to the invoice type's `aade_type`
      (an explicit value wins). When registering it records the counterparty's type.
    example: "13.1"

  serial_number:
    type: integer
    nullable: true
    description: >
      When registering: the counterparty's document number, stored as sent. When issuing:
      omit it to be numbered automatically on publish; a number you send is refused with
      422 (`errors.serial_number`: "Ο σειριακός αριθμός δεν είναι έγκυρος, γιατί υπάρχει
      ήδη.") if a published or cancelled document already holds it in the same numbering
      scope (company, branch, series and myDATA type).
    example: 44

  invoice_series_id:
    type: integer
    nullable: true
    description: >
      Issue only: invoice_series.id of your company. When registering it is refused with
      422 "invoice_series_id is only accepted when is_self_issued is true.".
    example: 3

  invoice_series:
    type: string
    nullable: true
    maxLength: 255
    description: >
      Register only — prohibited when `is_self_issued` is true. The counterparty's series,
      as free text.
    example: "Α"

  date:
    type: string
    format: date
    description: Invoice date. Sent as `date`, validated internally as payment_date.
    example: "2026-02-11"

  due_date:
    type: string
    format: date
    nullable: true
    description: Must be on or after `date`.
    example: "2026-03-11"

  supplier_id:
    type: integer
    description: suppliers.id
    example: 7

  document_type:
    type: string
    description: >
      `cash-register` is a deprecated alias of `retail`: it is accepted and stored as
      `retail`. `cancel-register` is not accepted on supplier invoices.
    enum:
      - invoice
      - credit-invoice
      - cash-receipt
      - return
      - delivery-note
      - delivery-return
      - delivery-internal
      - retail
      - cash-register
    example: invoice

  grand_total:
    type: number
    minimum: 0
    nullable: true
    description: >
      Optional checksum. The totals (sub_total / tax_total / grand_total) are always
      derived from `items`; when `grand_total` is sent it is compared against the
      calculated one (at cent precision) and a mismatch is rejected with
      422 `business_validation_error`.

  billing_address:
    description: >
      Single address object. Account linkage (account_id/account_type) is
      injected automatically from `supplier_id`. Send `zip`; it is stored as tk.
    $ref: ../clients/ClientAddressInputObject.yaml

  shipping_address:
    description: >
      Single address object. Required when dispatch details are present.
    $ref: ../clients/ClientAddressInputObject.yaml

  loading_address:
    description: Single address object.
    $ref: ../clients/ClientAddressInputObject.yaml

  dispatch_date:
    type: string
    format: date
    nullable: true
    description: Combined with dispatch_time into the dispatch details (delivery invoices).

  dispatch_time:
    type: string
    nullable: true
    description: Combined with dispatch_date into the dispatch details (delivery invoices).

  vehicle_number:
    type: string
    nullable: true
    maxLength: 50

  move_purpose:
    type: integer
    nullable: true
    description: myDATA move purpose code.

  other_move_purpose_title:
    type: string
    nullable: true
    maxLength: 255

  items:
    type: array
    nullable: true
    items:
      type: object
      additionalProperties: false
      description: >
        Each item must provide either product_id or description, and either
        product_id or measure_unit / measurement_unit_id.
      properties:
        product_id:
          type: integer
          nullable: true
          description: products_children.id
        expense_id:
          type: integer
          nullable: true
          description: >
            expenses.id — the expense category of the line. Defaults to the supplier's
            expense category, then to the product's.
        description:
          type: string
          nullable: true
          maxLength: 255
          description: >
            Optional when `product_id` is given; it then defaults to the product name.
        quantity:
          type: number
          minimum: 0.001
          description: Required when items is present.
        measure_unit:
          type: string
          nullable: true
          maxLength: 255
          description: >
            The unit written as free text. Matched against the company's measurement
            units by name, short name, plural, common abbreviation, english wording and
            peppol code, ignoring case, accents and trailing dots — so "Τεμάχια",
            "τεμ.", "pcs" and "C62" all reach the same unit. A bare number is read as
            the myDATA unit code. When nothing matches close enough the line falls back
            to the product's unit and then to the company's default unit ("Τεμάχιο"):
            an unrecognised spelling is never an error.
          example: τεμ.
        measurement_unit_id:
          type: integer
          nullable: true
          description: >
            measurement_units.id — takes precedence over `measure_unit`. Ignored (and
            resolved as if absent) when the id belongs to another company.
        unit_price:
          type: number
          nullable: true
          minimum: 0
          description: >
            Defaults to the supplier's cost for the product (or the product cost price)
            when `product_id` is given.
        discount_percentage:
          type: number
          nullable: true
          minimum: 0
          maximum: 100
        taricNo:
          type: string
          nullable: true
          maxLength: 10
          description: >
            TARIC/CN code of the line. Stored on the matched product when it has none yet.
        taxes:
          type: array
          nullable: true
          description: >
            Tax ids applied to the line (VAT included). Defaults to the product's tax for
            the supplier's tax type when `product_id` is given.
          items: { type: integer, description: taxes.id }
        mydata_classification_category:
          type: string
          nullable: true
          maxLength: 255
          description: myDATA classification category. Required when mydata_submit is set.
        mydata_classification_type:
          type: string
          nullable: true
          maxLength: 255
          description: myDATA classification type. Required when mydata_submit is set.
        vat_exemption_category:
          type: integer
          nullable: true

  taxes:
    type: array
    nullable: true
    items: { type: integer, description: taxes.id }

  payment_methods:
    type: array
    nullable: true
    description: Required when `payment_way` is `cash`; otherwise prohibited.
    items:
      type: object
      additionalProperties: false
      properties:
        paymentMethod:
          type: integer
          enum: [1, 2, 3, 4, 6, 7, 8]
          description: |
            Values:
            - 1: Domestic Payments Account
            - 2: Foreign Payments Account
            - 3: Cash
            - 4: Cheque
            - 6: Web Banking
            - 7: POS / e-POS
            - 8: IRIS Direct Payment
        paymentAmount:
          type: number
          minimum: 0
        terminal_id:
          type: integer
          nullable: true
          description: terminal_id from CBO (terminals table). Typically for paymentMethod 7 (POS / e-POS).
        instalments:
          type: integer
          nullable: true
          minimum: 0
        tip:
          type: number
          nullable: true
          minimum: 0
        paymentMethodInfo:
          type: string
          nullable: true
          maxLength: 255

  terms:
    type: string
    nullable: true
    maxLength: 1000

  notes:
    type: string
    nullable: true
    maxLength: 1000

  payment_way:
    type: string
    nullable: true
    enum: [cash, on-credit]

  currency_code:
    type: string
    nullable: true
    maxLength: 3

  branch_id:
    type: integer
    nullable: true
    description: branches.id

  isDraft:
    type: boolean
    nullable: true
    description: >
      When true the invoice is stored with status `Draft` and not published (no numbering,
      no stock movement). Publish it later with `POST /supplier-invoices/{id}/publish`.

  mydata_submit:
    type: boolean
    nullable: true
    description: >
      Transmit to myDATA on publish. Only for documents you issue (`is_self_issued: true`);
      on a registered purchase it is refused with 422 (`errors.mydata_submit`:
      "Registered supplier invoices cannot be submitted to myDATA."). A myDATA rejection
      rolls the whole request back and returns 422 `business_validation_error`.

  auto_create_cash_receipt:
    type: boolean
    nullable: true
    default: false
    description: >
      When true, publishing settles the posted `payment_methods` by creating the
      matching cash-receipt (or return, for credit invoices) documents.

required:
  - date
  - supplier_id
  - document_type
  - billing_address
