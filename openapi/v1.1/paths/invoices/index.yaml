get:
  tags: [Invoices]
  summary: Invoices (list)
  description: |
    Lists invoices with optional search and filtering.
    Response is paginated and wrapped as {success,data,meta}.
  security:
    - BearerAuth: []

  parameters:

    - name: search
      in: query
      required: false
      schema: { type: string }
      example: "INV-2026"

    - name: search_fields
      in: query
      required: false
      description: Comma-separated searchable fields.
      schema: { type: string }
      example: "serial_number,nickname"

    - name: serial_number
      in: query
      required: false
      schema: { type: string, maxLength: 255 }

    - name: date_from
      in: query
      required: false
      schema: { type: string, format: date }

    - name: date_to
      in: query
      required: false
      schema: { type: string, format: date }

    - name: status
      in: query
      required: false
      style: form
      explode: true
      schema:
        oneOf:
          - type: string
          - type: array
            items: { type: string }

    - name: document_type
      in: query
      required: false
      description: >
        Filter by one or more document types. The legacy names are accepted:
        `cash-register` matches `retail` documents and `cancel-register` matches
        `credit-retail` documents.
      style: form
      explode: true
      schema:
        oneOf:
          - type: string
          - type: array
            items: { type: string }

    - name: client_id
      in: query
      required: false
      schema: { type: integer }

    - name: invoice_type_id
      in: query
      required: false
      description: invoice_type_id
      schema: { type: integer }

    - name: invoice_series_id
      in: query
      required: false
      schema: { type: integer }

    - name: sort_by
      in: query
      required: false
      schema:
        type: string
        enum: [id, serial_number, payment_date, created_at, updated_at]
      example: payment_date

    - name: sort_order
      in: query
      required: false
      schema:
        type: string
        enum: [asc, desc]
      example: desc

    - name: page
      in: query
      schema: { type: integer }

    - name: page_size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50

  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/invoices/InvoiceIndexResponse.yaml
    "401": { $ref: ../../../_shared/components/responses/Unauthorized.yaml }
    "403": { $ref: ../../../_shared/components/responses/Forbidden.yaml }

post:
  tags: [Invoices]
  summary: Invoice (create)
  description: |
    Creates a new invoice and, unless `isDraft` is true, publishes it.
    Response is wrapped as {success,data}.

    Changes on 2026-11-03:
    - `document_type: cash-register` is accepted again and stored as `retail`;
      `invoice-income` / `accommodation-income` (myDATA 7.1, 8.1, 8.2) are accepted, and an
      `invoice` posted with an income type is created under the matching income document type.
    - A delivery note linked through `related_documents` or `delivery_notes` is returned
      under `delivery_notes`; other links under `related_documents`.
    - An id of another company's document in `related_documents` / `delivery_notes` is
      refused with 422.
    - When the invoice is published in the same call, the publish rules of
      `POST /invoices/{id}/publish` apply (serial-tracked lines need their serial numbers,
      a hand-typed `serial_number` already held in its numbering scope is refused under
      `errors.serial_number`, at most 350 lines).
  security:
    - BearerAuth: []

  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/invoices/InvoiceStore.yaml

  responses:
    "201":
      description: Created
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/invoices/InvoiceSingleResponse.yaml
    "401": { $ref: ../../../_shared/components/responses/Unauthorized.yaml }
    "403": { $ref: ../../../_shared/components/responses/Forbidden.yaml }
    "422":
      description: Validation error, or a business rule raised while publishing.
      content:
        application/json:
          schema:
            anyOf:
              - $ref: ../../../_shared/components/schemas/errors/ValidationError.yaml
              - $ref: ../../components/schemas/common/BusinessErrorResponse.yaml
          examples:
            foreignRelatedDocument:
              summary: related_documents holds another company's id
              value:
                status: validation_error
                message: "Validation failed."
                errors:
                  related_documents.0: ["Το επιλεγμένο <b>related_documents.0</b> δεν είναι έγκυρο."]
            serialTaken:
              summary: Hand-typed serial_number already held in its numbering scope
              value:
                status: validation_error
                message: "Validation failed."
                errors:
                  serial_number: ["Ο σειριακός αριθμός δεν είναι έγκυρος, γιατί υπάρχει ήδη."]