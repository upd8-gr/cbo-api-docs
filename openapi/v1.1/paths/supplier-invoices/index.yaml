get:
  tags: [Supplier Invoices]
  summary: Supplier invoices (list)
  description: |
    Lists supplier invoices with optional search and filtering.
    Response is paginated and wrapped as {success,data,meta}.
  security:
    - BearerAuth: []

  parameters:

    - name: search
      in: query
      required: false
      description: Search term (used only when search_fields is present).
      schema: { type: string }
      example: "ΤΠΥ"

    - name: search_fields
      in: query
      required: false
      description: >
        Comma-separated fields used in OR LIKE search. Allowed fields:
        `id`, `serial_number`, `status`, `document_type`, `nickname`.
      schema: { type: string }
      example: "serial_number,status"

    - name: serial_number
      in: query
      required: false
      schema: { type: string }

    - name: date_from
      in: query
      required: false
      description: Filters payment_date range (used with date_to).
      schema: { type: string, format: date }

    - name: date_to
      in: query
      required: false
      description: Must be on or after date_from. Filters payment_date range (used with date_from).
      schema: { type: string, format: date }

    - name: status
      in: query
      required: false
      description: Filter by one or more statuses.
      style: form
      explode: true
      schema:
        oneOf:
          - type: string
          - type: array
            items: { type: string }

    - name: document_type
      in: query
      required: false
      description: Filter by one or more document types.
      style: form
      explode: true
      schema:
        oneOf:
          - type: string
          - type: array
            items: { type: string }

    - name: supplier_id
      in: query
      required: false
      schema: { type: integer }

    - name: invoice_type_id
      in: query
      required: false
      schema: { type: integer }

    - name: invoice_series_id
      in: query
      required: false
      schema: { type: integer }

    - name: sort_by
      in: query
      required: false
      schema:
        type: string
        enum: [id, serial_number, payment_date, created_at, updated_at]
      example: payment_date

    - name: sort_order
      in: query
      required: false
      schema:
        type: string
        enum: [asc, desc]
      example: desc

    - name: page
      in: query
      required: false
      schema: { type: integer }

    - name: page_size
      in: query
      required: false
      description: Page size (default 50, max 100).
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50

  responses:
    "200":
      description: OK
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/supplier-invoices/SupplierInvoiceIndexResponse.yaml
          examples:
            default:
              value:
                success: true
                data:
                  - id: 1
                    representation: "ΤΠΥ-0001"
                    status: "published"
                    document_title: "Τιμολόγιο Παροχής Υπηρεσιών"
                    invoice_type_id: 12
                    serial_number: 1
                    invoice_series_id: 3
                    date: "2026-02-11"
                    supplier_id: 7
                    sub_total: 200
                    tax_total: 48
                    grand_total: 248
                    currency_code: "EUR"
                    created: "2026-02-11 10:00:00"
                    modified: "2026-02-12 10:00:00"
                meta:
                  current_page: 1
                  last_page: 1
                  per_page: 50
                  total: 1
    "401": { $ref: ../../../_shared/components/responses/Unauthorized.yaml }
    "403": { $ref: ../../../_shared/components/responses/Forbidden.yaml }

post:
  tags: [Supplier Invoices]
  summary: Supplier invoice (create)
  description: |
    Creates a new supplier invoice.
    Response is wrapped as {success,data}.
  security:
    - BearerAuth: []

  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../components/schemas/supplier-invoices/SupplierInvoiceStore.yaml

  responses:
    "201":
      description: Created
      content:
        application/json:
          schema:
            $ref: ../../components/schemas/supplier-invoices/SupplierInvoiceSingleResponse.yaml
    "401": { $ref: ../../../_shared/components/responses/Unauthorized.yaml }
    "403": { $ref: ../../../_shared/components/responses/Forbidden.yaml }
    "422": { $ref: ../../../_shared/components/responses/UnprocessableEntity.yaml }
